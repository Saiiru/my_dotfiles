[tasks.install]
description = "Instala dependências"
run = "pnpm install || npm install"

[tasks.test]
description = "Roda testes com Jest"
run = "pnpm test || npm test"

[tasks.lint]
description = "Roda ESLint"
run = "pnpm lint || npm run lint"

[tasks.dev]
description = "Modo desenvolvimento"
run = "pnpm dev || npm run dev"
