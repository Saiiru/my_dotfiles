services:
  app:
    image: ${APP_IMAGE:-bat/__APP_NAME__:dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - env/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - batnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16
    container_name: "__APP_NAME__-db"
    environment:
      POSTGRES_DB: "__DB_NAME__"
      POSTGRES_USER: "__DB_USER__"
      POSTGRES_PASSWORD: "__DB_PASS__"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - batnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __DB_USER__ -d __DB_NAME__"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:

networks:
  batnet:
    driver: bridge
