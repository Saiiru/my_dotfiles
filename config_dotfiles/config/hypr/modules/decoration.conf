# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#  Decoration
#  Rounding, blur, shadows, and dimming.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
decoration {
    rounding = 10
    rounding_power = 10
    
    blur {
        enabled = true
        xray = true
        special = true
        new_optimizations = true
        size = 4
        passes = 6
        brightness = 1
        noise = 0.05
        contrast = 1
        popups = true
        popups_ignorealpha = 0.6
    }
    
    # Shadow
    shadow {
        enabled = true
        ignore_window = true
        range = 12
        offset = 0 2
        render_power = 2
        color = rgba(0000002A)
    }

    
    # Dim
    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0
}
