# Minimal capsule variant — source base & shrink status content
source-file ~/.config/tmux/tmux.conf

set -g status-left-length 28
set -g status-left "#[fg=#ff073a]#[fg=#0a0b0d,bg=#ff073a,bold] #S #[fg=#ff073a,bg=#0a0b0d] "
set -g status-right ""
set -g window-status-separator "  "
set -g window-status-format "#[fg=#586270]#I:#W"
set -g window-status-current-format "#[fg=#ff073a,bold]#I:#W"
