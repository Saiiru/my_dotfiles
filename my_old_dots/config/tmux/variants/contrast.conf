# High-contrast HUD variant — deeper blacks and neon accents
source-file ~/.config/tmux/tmux.conf

set -g status-style "fg=#e6edf3,bg=#000000"
set -g status-left "#[fg=#ff073a]#[fg=#000000,bg=#ff073a,bold] #{@kora_icon}  #S #[fg=#ff073a,bg=#000000] "
set -g status-right "#{?client_prefix,#[fg=#7c3aed]#[fg=#000000,bg=#7c3aed]  #[fg=#7c3aed,bg=#000000] ,}#[fg=#22d3ee]#[fg=#000000,bg=#22d3ee]  #{window_panes} #[fg=#22d3ee,bg=#000000] #[fg=#7c3aed]#[fg=#000000,bg=#7c3aed]  #{session_windows} #[fg=#7c3aed,bg=#000000]"
set -g window-status-style "fg=#7c849c,bg=#000000"
set -g window-status-format "#[fg=#181818]#[fg=#e6edf3,bg=#181818] #{b:#{?#{==:#{window_name},},#{pane_current_command},#{window_name}}} #[fg=#181818,bg=#000000]"
set -g window-status-current-format "#[fg=#ff073a]#[fg=#000000,bg=#ff073a,bold] #W #[fg=#ff073a,bg=#000000]"
set -g pane-border-style "fg=#181818"
set -g pane-active-border-style "fg=#ff073a"
