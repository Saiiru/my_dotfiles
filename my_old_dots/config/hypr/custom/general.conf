xwayland {
    enabled = true
}

# Kora Neon overrides for Dank Material Shell workflow.
# Focus on cyan → purple gradients, soft neon shadows, and animated borders.

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 3
    col.active_border = rgba(220,20,60,1.0)
    col.inactive_border = rgba(32,34,36,0.92)
    resize_on_border = true
    no_focus_fallback = true
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        new_optimizations = true
        xray = true
        special = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 1.1
        brightness = 0.95
        vibrancy = 0.25
        vibrancy_darkness = 0.18
        popups = true
        popups_ignorealpha = 0.18
    }

    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.4

    shadow {
        enabled = true
        ignore_window = false
        range = 26
        offset = 0 2
        render_power = 2
        color = rgba(34,211,238,0.55)
    }
}

animations {
    enabled = true
    bezier = fast, 0.2, 0.9, 0.2, 1.0
    bezier = neon_in, 0.05, 0.75, 0.1, 1.05
    bezier = neon_out, 0.3, 0.0, 0.2, 1.0

    animation = windows, 1, 6, neon_in, popin
    animation = windowsIn, 1, 6, neon_in, popin
    animation = windowsOut, 1, 5, neon_out, popin
    animation = fade, 1, 6, neon_in
    animation = fadeIn, 1, 6, neon_in
    animation = fadeOut, 1, 4, neon_out
    animation = layers, 1, 6, neon_in, slide
    animation = layersOut, 1, 4, neon_out, slide
    animation = workspaces, 1, 7, neon_in, slide
    animation = border, 1, 4, fast
}

misc {
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    background_color = rgba(2,2,2,255)
}

dwindle {
    preserve_split = true
    smart_split = false
    use_active_for_splits = true
    default_split_ratio = 1.0
}

group {
    insert_after_current = true
    focus_removed_window = true

    groupbar {
        enabled = true
        font_family = "CaskaydiaMono Nerd Font"
        font_size = 11
        height = 18
        col.active = rgba(220,20,60,1.0)
        col.inactive = rgba(32,34,36,0.92)
        col.locked_active = rgb(124,58,237)
        col.locked_inactive = rgba(19,19,24,0.78)
        text_color = rgb(230,230,230)
        rounding = 8
        gradients = false
    }
}
