# Dank Material Shell overlays for QuickShell (Kora Neon stack)

# Core shell surfaces
bindd = SUPER, SPACE, Spotlight, exec, qs ipc call spotlight toggle
bindd = SUPER, N, Notifications, exec, qs ipc call notifications toggle
bindd = SUPER, P, Dash, exec, qs ipc call dash toggle system
bindd = SUPER, V, Clipboard HUD, exec, qs ipc call clipboard toggle
bindd = SUPER, SEMICOLON, Power Menu, exec, qs ipc call powermenu toggle

# System controls via QuickShell IPC
bindd = ,XF86AudioMute, Audio Mute, exec, qs ipc call audio mute
bindd = ,XF86AudioMicMute, Mic Mute, exec, qs ipc call audio micmute
bindd = ,XF86MonBrightnessUp, Brightness +5, exec, qs ipc call brightness increment 5 default
bindd = ,XF86MonBrightnessDown, Brightness -5, exec, qs ipc call brightness decrement 5 default
bindd = SUPER, L, Lock Screen, exec, qs ipc call lock lock
bindd = SUPER, M, Media Popout, exec, qs ipc call dash toggle media

# Wallpaper + palette helpers
bindd = SUPER ALT, W, Pick Wallpaper, exec, ${env:DOTFILES_DIR}/bin/wallpick
bindd = SUPER ALT, C, Reapply Palette, exec, qs ipc call colorpalette apply
