# Host-specific automations layered on top of the shared execs.
# Keep this file focused on tools that are not started globally.

# Start SSH agent for GUI applications
exec-once = ~/.config/hypr/custom/scripts/start-ssh-agent.sh

# Apply preferred DNS profile automatically (default: Cloudflare)
exec-once = ~/.config/hypr/custom/scripts/auto-dns.sh &

# Legacy Red Hood welcome hooks
exec-once = sleep 2 && ~/.config/hypr/scripts/red-hood-notify.sh welcome "Neon systems online"
exec-once = sleep 2 && ~/.config/hypr/scripts/wallpaper-glitch.sh current >/dev/null 2>&1

# Ensure the Dank Material Shell color palette is applied after startup
exec-once = sleep 4 && qs -c dms ipc call colorpalette apply
