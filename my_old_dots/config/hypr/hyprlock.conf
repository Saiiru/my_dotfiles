@define-color bg rgba(0a0b0dee);
@define-color glow rgba(dc143ccc);
@define-color accent rgba(22d3eeff);
@define-color text rgba(e6edf3ff);

general {
    disable_loading_bar = false
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    color = rgba(000000ff)
    path = $HOME/.config/omarchy/current/background
    blur_size = 12
    blur_passes = 4
    noise = 0.02
    brightness = 0.55
    contrast = 1.1
    vibrancy = 0.25
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = @glow
    inner_color = rgba(050505bb)
    font_color = @text
    fade_on_empty = false
    hide_input = false
    rounding = 14
    position = 0, -80
    halign = center
    valign = center
    placeholder_text = <span foreground="#22d3ee">▸ Enter access code</span>
    check_color = rgba(22e3b3ff)
    fail_color = rgba(ff073aff)
    fail_transition = 250
    fail_text = <span foreground="#ff073a">Access denied</span>
    capslock_color = rgba(facc15ff)
    numlock_color = rgba(22d3eeff)
    bothlock_color = rgba(7c3aedff)
    shadow_size = 14
    shadow_color = rgba(dc143c66)
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:5000] date +"%A, %d %B"
    color = rgba(ee79d1ff)
    font_size = 20
    font_family = "JetBrainsMono Nerd Font"
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = @text
    font_size = 96
    font_family = "JetBrainsMono Nerd Font Bold"
    position = 0, -240
    halign = center
    valign = center
    shadow_color = rgba(0,0,0,180)
    shadow_size = 18
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/hyprlock/status.sh
    color = rgba(22d3eeff)
    font_size = 14
    font_family = "JetBrainsMono Nerd Font"
    position = -40, 40
    halign = right
    valign = top
}

label {
    monitor =
    text = <span foreground="#dc143c">◢</span> RED HOOD SYSTEM <span foreground="#dc143c">◣</span>
    color = rgba(e6edf399)
    font_size = 18
    font_family = "JetBrainsMono Nerd Font Bold"
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/check-capslock.sh
    color = rgba(facc15ff)
    font_size = 13
    font_family = "JetBrainsMono Nerd Font"
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/power-info.sh
    color = rgba(22e3b3cc)
    font_size = 13
    font_family = "JetBrainsMono Nerd Font"
    position = 40, 40
    halign = left
    valign = top
}
