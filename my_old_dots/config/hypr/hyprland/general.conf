# ===============================================================
# General Config - RED HOOD EDITION (Corrected)
# ===============================================================

# Sourced by hyprland.conf

# ---------------------------------------------------------------
# Input, Binds, Render, Misc (from your original config)
# ---------------------------------------------------------------
input {
    kb_layout = br
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
    special_fallthrough = true
    follow_mouse = 1
}

render {
    new_render_scheduling = true
    cm_fs_passthrough = 2
    cm_enabled = true
    send_content_type = true
    cm_auto_hdr = 2
    direct_scanout = 2
}    

binds {
    scroll_event_delay = 0
}

misc {
    vfr = 1
    vrr = 0
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)
    
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    
    disable_splash_rendering = true
    initial_workspace_tracking = false
}

# ---------------------------------------------------------------
# Red Hood Theme Applied
# ---------------------------------------------------------------
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 3

    # Red Hood animated gradient border (default stack)
    col.active_border = rgba(220,20,60,1.0)
    col.inactive_border = rgba(36,36,36,0.92)

    resize_on_border = true
    no_focus_fallback = true
    layout = dwindle
}

decoration {
    rounding = 10
    
    blur {
        enabled = true
        xray = true
        special = true
        new_optimizations = true
        size = 6
        passes = 4
        brightness = 1
        noise = 0.04
        contrast = 1.05
        popups = true
        popups_ignorealpha = 0.5
    }

    shadow {
        enabled = true
        ignore_window = true
        range = 18
        offset = 0 2
        render_power = 2
        color = rgba(255,7,58,0.43)
    }

    dim_inactive = true
    dim_strength = 0.08
}

animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07

    animation = windows, 1, 3, md3_decel, popin
    animation = windowsIn, 1, 3, md3_decel, popin
    animation = windowsOut, 1, 3, md3_accel, popin
    animation = border, 1, 5, md3_decel
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 2, menu_accel, slide
    animation = workspaces, 1, 3, md3_decel, slide
}

dwindle {
	preserve_split = true
	smart_split = false
	smart_resizing = false
}

group {
    groupbar {
        enabled = true
        col.active = rgba(220,20,60,1.0)
        col.inactive = rgba(26,26,26,0.92)
        height = 22
        priority = 3
        render_titles = true
        font_family = Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        font_size = 11
        gradients = false
        text_color = rgba(230,237,243,1.0)
        rounding = 8
    }
}

# Plugin settings from your original config
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgba(0,0,0,1.0)
        workspace_method = center current
        enable_gesture = false
        gesture_distance = 300
        gesture_positive = false
    }
}
