;  NEON-NIRI v2 - GAMEMODE CONFIGURATION
;  Feral Interactive GameMode Config tuned for DEFAULT/DEV/GAME flows
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[general]
reaper_freq=5
desiredgov=performance
defaultgov=schedutil
igpu_desiredgov=performance
igpu_defaultgov=schedutil
softrealtime=1
renice=10
ioprio=0

[filter]
; whitelist=/path/to/whitelist.txt
; blacklist=/path/to/blacklist.txt

[gpu]
apply_gpu_optimisations=1
nv_powermizer_mode=1
amd_performance_level=high

[custom]
start=$HOME/.config/gamemode/scripts/gamemode-start.sh
end=$HOME/.config/gamemode/scripts/gamemode-end.sh
