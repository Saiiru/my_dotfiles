#═══════════════════════════════════════════════════════════════════════
# TMUX CONFIGURATION
# Professional terminal multiplexer setup
# Author: Sairu
#═══════════════════════════════════════════════════════════════════════

#───────────────────────────────────────────────────────────────────────
# PREFIX & CORE
#───────────────────────────────────────────────────────────────────────

set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on

#───────────────────────────────────────────────────────────────────────
# DISPLAY
#───────────────────────────────────────────────────────────────────────

set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"
set-option -g display-time 3000
set-option -g escape-time 0
set-option -g focus-events on
set-option -s extended-keys on

#───────────────────────────────────────────────────────────────────────
# HISTORY & CLIPBOARD
#───────────────────────────────────────────────────────────────────────

set-option -g history-limit 100000
set-option -g detach-on-destroy off

# System clipboard integration (fixes Ctrl-C/V)
set-option -g set-clipboard on
set-option -s set-clipboard on

# Better copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Paste with prefix-P
bind P paste-buffer

#───────────────────────────────────────────────────────────────────────
# WINDOWS & PANES
#───────────────────────────────────────────────────────────────────────

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

bind-key x kill-pane
bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

#───────────────────────────────────────────────────────────────────────
# SESH
#───────────────────────────────────────────────────────────────────────

bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --list-border --no-sort --prompt '⚡  ' --input-border --header-border \
    --bind 'tab:down,btab:up' --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' --preview 'sesh preview {}' \
)\""

bind-key "N" display-popup -E "sesh ui"
bind-key "Z" display-popup -E "sesh connect \$(sesh list | fzf --height 24)"
bind -N "Root session" 9 run-shell "sesh connect --root $(pwd)"
bind -N "Last session" L run-shell "sesh last || tmux display-message -d 1000 'Only one session'"

#───────────────────────────────────────────────────────────────────────
# QUICK ACTIONS
#───────────────────────────────────────────────────────────────────────

bind -N "Lazygit" g new-window -S -n '🌳' 'lazygit'
bind -N "Editor" E new-window -S -n '📝' 'nvim +GoToFile'
bind -N "Kill session" Q kill-session
bind -N "Break pane" B break-pane
bind -N "Join pane" J join-pane -t 1

#───────────────────────────────────────────────────────────────────────
# COLORS - PURE BLACK
#───────────────────────────────────────────────────────────────────────

BG="#000000"
SURFACE="#0f0f0f"

HOT_PINK="#FF2D95"
ELECTRIC_BLUE="#00D9FF"
CYBER_PURPLE="#B026FF"
BRIGHT_YELLOW="#FFE600"
NEON_GREEN="#00FF41"

WHITE="#FFFFFF"
GRAY="#808080"
DARK_GRAY="#404040"

SEP_LEFT=""
SEP_RIGHT=""

#───────────────────────────────────────────────────────────────────────
# STATUS BAR (Hidden when in vim/nvim)
#───────────────────────────────────────────────────────────────────────

set-option -g status-position top
set-option -g status-style "bg=${BG},fg=${WHITE}"
set-option -g status-interval 3
set-option -g status-justify absolute-centre

# Left: Session (hidden in nvim)
set-option -g status-left "\
#{?#{==:#{pane_current_command},nvim},,\
#[bg=${HOT_PINK},fg=${BG},bold] #S \
#[bg=${BG},fg=${HOT_PINK},nobold]${SEP_RIGHT}\
}"
set-option -g status-left-length 300

# Right: Hostname (hidden in nvim)
set-option -g status-right "\
#{?#{==:#{pane_current_command},nvim},,\
#[bg=${BG},fg=${ELECTRIC_BLUE}]${SEP_LEFT}\
#[bg=${ELECTRIC_BLUE},fg=${BG},bold] #h \
}"
set-option -g status-right-length 300

# Windows
set-option -g window-status-format " #I #[fg=${GRAY}]#W "
set-option -g window-status-current-format "\
#[bg=${BG},fg=${CYBER_PURPLE}]${SEP_LEFT}\
#[bg=${CYBER_PURPLE},fg=${BG},bold] #I \
#[bg=${SURFACE},fg=${BRIGHT_YELLOW},bold]#W \
#[bg=${BG},fg=${SURFACE}]${SEP_RIGHT}\
"
set-option -g window-status-separator ""

#───────────────────────────────────────────────────────────────────────
# BORDERS
#───────────────────────────────────────────────────────────────────────

set-option -g pane-active-border-style "fg=${HOT_PINK},bg=default"
set-option -g pane-border-style "fg=${DARK_GRAY},bg=default"
set-option -g allow-passthrough on
set-option -g message-style "bg=${SURFACE},fg=${BRIGHT_YELLOW},bold"
set-option -g message-command-style "bg=${SURFACE},fg=${ELECTRIC_BLUE},bold"
set-option -g mode-style "bg=${CYBER_PURPLE},fg=${BG},bold"

#───────────────────────────────────────────────────────────────────────
# PLUGINS
#───────────────────────────────────────────────────────────────────────

set -g @floax-bind H
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @tmux-nerd-font-window-name-shell-icon ''
set -g @tmux-nerd-font-window-name-show-name false

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'joshmedeski/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

run '~/.tmux/plugins/tpm/tpm'
