#═══════════════════════════════════════════════════════════════════════
# TMUX CONFIGURATION
# Professional terminal multiplexer setup
# Author: Sairu
#═══════════════════════════════════════════════════════════════════════

#───────────────────────────────────────────────────────────────────────
# PREFIX & CORE
#───────────────────────────────────────────────────────────────────────

set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on

#───────────────────────────────────────────────────────────────────────
# DISPLAY
#───────────────────────────────────────────────────────────────────────

set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"
set-option -g display-time 3000
set-option -g escape-time 0
set-option -g focus-events on
set-option -s extended-keys on

#───────────────────────────────────────────────────────────────────────
# HISTORY & CLIPBOARD
#───────────────────────────────────────────────────────────────────────

set-option -g history-limit 100000
set-option -g detach-on-destroy off

# System clipboard integration (fixes Ctrl-C/V)
set-option -g set-clipboard on
set-option -s set-clipboard on

# Better copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Paste with prefix-P
bind P paste-buffer

#───────────────────────────────────────────────────────────────────────
# WINDOWS & PANES
#───────────────────────────────────────────────────────────────────────

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

bind-key x kill-pane
bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

#───────────────────────────────────────────────────────────────────────
# MAINTENANCE
#───────────────────────────────────────────────────────────────────────

# Reload tmux config without restarting
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded"

#───────────────────────────────────────────────────────────────────────
# SESH
#───────────────────────────────────────────────────────────────────────

bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --list-border --no-sort --prompt '⚡  ' --input-border --header-border \
    --bind 'tab:down,btab:up' --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' --preview 'sesh preview {}' \
)\""

bind-key "N" display-popup -E "sesh ui"
bind-key "Z" display-popup -E "sesh connect \$(sesh list | fzf --height 24)"
bind -N "Root session" 9 run-shell "sesh connect --root $(pwd)"
bind -N "Last session" L run-shell "sesh last || tmux display-message -d 1000 'Only one session'"

#───────────────────────────────────────────────────────────────────────
# QUICK ACTIONS
#───────────────────────────────────────────────────────────────────────

bind -N "Lazygit" g new-window -S -n '🌳' 'lazygit'
bind -N "Editor" E new-window -S -n '📝' 'nvim +GoToFile'
bind -N "Kill session" Q kill-session
bind -N "Break pane" B break-pane
bind -N "Join pane" J join-pane -t 1

#───────────────────────────────────────────────────────────────────────
# COLORS — CYBERDREAM BATMAN
#───────────────────────────────────────────────────────────────────────

RED="#ff5555"
GREEN="#7cff00"
YELLOW="#ffd166"
BLUE="#00cfff"
MAGENTA="#ff6ec7"
CYAN="#00f0ff"
BLACK="#000000"
DARK_GRAY="#0a0a12"
LIGHT_GRAY="#141127"
BG="#000000"
FG="#f8f8f2"

HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"

set-option -g status-style bg=${BG},fg=${FG}
set-option -g status-justify centre
set-option -g status-interval 30

set-option -g status-left '#[fg=${BLACK},bg=${YELLOW},bold] #S #[fg=${YELLOW},bg=${BG}]${HALF_ROUND_CLOSE}#[fg=${FG},bg=${BG}] #{?client_prefix,⌨ ,}#[default]'

set-option -g status-right '#[fg=${CYAN}]#H #[fg=${LIGHT_GRAY}]· #[fg=${FG}]%Y-%m-%d %H:%M #[fg=${LIGHT_GRAY}]· #[fg=${GREEN}]#(uptime -p | sed "s/^up //")#[default]'

set-option -g status-left-length 120
set-option -g status-right-length 120

set-option -g window-status-format "\
 #[fg=${MAGENTA}]#I#[fg=${FG}]:#[fg=${FG}]#W \
"

set-option -g window-status-current-format "\
#[fg=${YELLOW},bg=default]${HALF_ROUND_OPEN}\
#[bg=${YELLOW},fg=${BLACK},bold]#I#[fg=${BLACK}]:#[fg=${BLACK}]#W\
#[fg=${YELLOW},bg=default]${HALF_ROUND_CLOSE}\
"

set-option -g window-status-separator ""

set-option -g pane-active-border-style "fg=${CYAN},bg=default"
set-option -g pane-border-style "fg=${DARK_GRAY},bg=default"
set-option -g message-style "bg=${LIGHT_GRAY},fg=${FG},bold"
set-option -g message-command-style "bg=${LIGHT_GRAY},fg=${BLUE},bold"
set-option -g mode-style "bg=${MAGENTA},fg=${BLACK},bold"

#───────────────────────────────────────────────────────────────────────
# TASK MENUS & POMODORO
#───────────────────────────────────────────────────────────────────────

bind-key A display-menu -T '#[fg=${RED}]Taskwarrior' \
  'n' 'Próximas (popup)' 'run-shell "tmux display-popup -E \"task next\""' \
  't' 'Hoje' 'run-shell "tmux display-popup -E \"task today\""' \
  'c' 'Contexto treino' 'run-shell "task context training >/dev/null"' \
  's' 'Contexto estudo' 'run-shell "task context study >/dev/null"' \
  'a' 'Reset contexto' 'run-shell "task context none >/dev/null"' \
  'x' 'Nova tarefa' 'run-shell "tmux display-popup -E task\\ add"'

set -g @pomodoro-plus-format '#{pomodoro_status} #{pomodoro_time}'

#───────────────────────────────────────────────────────────────────────
# PLUGINS
#───────────────────────────────────────────────────────────────────────

run-shell "mkdir -p #{HOME}/.local/state/tmux/resurrect"
run-shell "mkdir -p #{HOME}/.local/state/tmux/continuum"
set -g @floax-bind H
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @tmux-nerd-font-window-name-shell-icon ''
set -g @tmux-nerd-font-window-name-show-name false

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'joshmedeski/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-pomodoro-plus'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir "#{HOME}/.local/state/tmux/resurrect"
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-dir "#{HOME}/.local/state/tmux/continuum"

run '~/.tmux/plugins/tpm/tpm'
