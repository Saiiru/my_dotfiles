#═══════════════════════════════════════════════════════════════════════
# TMUX CONFIGURATION
# Professional terminal multiplexer setup
# Author: Sairu
# https://github.com/Sairu/my_dotfiles
#═══════════════════════════════════════════════════════════════════════

#───────────────────────────────────────────────────────────────────────
# PREFIX & CORE SETTINGS
#───────────────────────────────────────────────────────────────────────

# Rebind prefix to CTRL-A (more ergonomic than default CTRL-B)
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start numbering at 1 for better keyboard reachability
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse support for modern workflow
set-option -g mouse on

# Allow renumbering windows with ß key (german keyboard compatibility)
bind ß move-window -r

#───────────────────────────────────────────────────────────────────────
# DISPLAY & TERMINAL
#───────────────────────────────────────────────────────────────────────

# Terminal colors and capabilities
set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

# Fix terminal title display
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

# Display settings
set-option -g display-time 3000
set-option -g escape-time 0
set-option -g focus-events on
set-option -s extended-keys on

#───────────────────────────────────────────────────────────────────────
# HISTORY & SESSION MANAGEMENT
#───────────────────────────────────────────────────────────────────────

# Increase history limit for extensive scrollback
set-option -g history-limit 100000

# Don't exit tmux when closing a session
set-option -g detach-on-destroy off

# Use system clipboard
set-option -g set-clipboard on

#───────────────────────────────────────────────────────────────────────
# WINDOW & PANE BEHAVIOR
#───────────────────────────────────────────────────────────────────────

# Open new windows and panes in current working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode vim bindings
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Kill pane without confirmation prompt
bind-key x kill-pane

# Open pane content in editor
bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

#───────────────────────────────────────────────────────────────────────
# SESSION MANAGEMENT WITH SESH
#───────────────────────────────────────────────────────────────────────

# Global sessions with fuzzy finder
bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --list-border \
    --no-sort --prompt '⚡  ' \
    --input-border \
    --header-border \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' \
    --preview 'sesh preview {}' \
)\""

# Sesh UI popup
bind-key "N" display-popup -E "sesh ui"

# Root sessions filter
bind-key "R" run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --query  \"\$(sesh root)\" \
    --list-border \
    --no-sort --prompt '⚡  ' \
    --input-border \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' \
    --preview 'sesh preview {}' \
)\""

# Quick session switcher with zf
bind-key "Z" display-popup -E "sesh connect \$(sesh list | fzf --height 24)"

# Switch to root session
bind -N "Switch to root session via sesh" 9 run-shell "sesh connect --root $(pwd)"

# Last session toggle
bind -N "Toggle to last session" L run-shell "sesh last || tmux display-message -d 1000 'Only one session'"

#───────────────────────────────────────────────────────────────────────
# QUICK LAUNCH BINDINGS
#───────────────────────────────────────────────────────────────────────

bind -N "Open AI assistant" A new-window -S -n '🤖' 'ai'
bind -N "Open builder" b new-window -S -n '🔨' 'build'
bind -N "Open dev environment" D new-window -S -n '🔧' 'dev'
bind -N "Open editor" E new-window -S -n '📝' 'nvim +GoToFile'
bind -N "Open GitHub dashboard" G new-window -c "#{pane_current_path}" -n "😺" "ghd 2> /dev/null"
bind -N "Open Lazygit" g new-window -S -n '🌳' 'lazygit'
bind -N "Kill current session" Q kill-session
bind -N "Run npm script" Y split-window -v -l 10 "npm run (jq -r '.scripts | keys[]' package.json | fzf --no-border)"
bind -N "Break pane to new window" B break-pane
bind -N "Join pane to window 1" J join-pane -t 1

#───────────────────────────────────────────────────────────────────────
# STYLING - GRUVBOX MATERIAL THEME
#───────────────────────────────────────────────────────────────────────

# Color palette
RED="#ea6962"
GREEN="#a9b665"
YELLOW="#d8a657"
BLUE="#7daea3"
MAGENTA="#d3869b"
CYAN="#89b482"
BLACK="#1d2021"
DARK_GRAY="#32302F"
LIGHT_GRAY="#4F4946"
BG="#32302F"
FG="#d4be98"

# Nerd Font icons
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"

# Status bar position (uncomment to move to bottom)
set-option -g status-position top

# Status bar styling
set-option -g status-style bg=${BG},fg=${FG}
set-option -g status-interval 3
set-option -g status-justify centre

# Status left section
set-option -g status-left "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[bg=${LIGHT_GRAY},fg=${YELLOW}]#S \
#[fg=${LIGHT_GRAY},bg=default]${TRIANGLE_CLOSE}\
"
set-option -g status-left-length 300

# Status right section
set-option -g status-right "\
#[fg=${LIGHT_GRAY},bg=default]${TRIANGLE_OPEN}\
#[bg=${LIGHT_GRAY},fg=${CYAN}] #h\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"
set-option -g status-right-length 300

# Window status format (inactive)
set-option -g window-status-format "\
 \
#I\
#[fg=${MAGENTA}]:\
#[fg=default]#W\
 \
"

# Window status format (active)
set-option -g window-status-current-format "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[bg=${LIGHT_GRAY},fg=default]#I\
#[fg=${RED}]:\
#[fg=default]#W\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"

# Remove window separator
set-option -g window-status-separator ""

# Pane borders
set-option -g pane-active-border-style 'fg=black,bg=default'
set-option -g pane-border-style 'fg=brightblack,bg=default'

# Messages
set-option -g allow-passthrough on
set-option -g message-style bg=default,fg=${YELLOW}
set-option -g message-command-style bg=default,fg=${YELLOW}
set-option -g mode-style bg=default,fg=${YELLOW}

#───────────────────────────────────────────────────────────────────────
# PLUGINS CONFIGURATION
#───────────────────────────────────────────────────────────────────────

# Plugin settings
set -g @floax-bind H
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @tmux-last-color on
set -g @tmux-last-pager 'less -r'
set -g @tmux-last-prompt-pattern ' '
set -g @tmux-nerd-font-window-name-shell-icon ''
set -g @tmux-nerd-font-window-name-show-name false

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'joshmedeski/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Initialize TPM (must be at the end)
run "$HOME/gotham/config/tmux/plugins/tpm/tpm"
