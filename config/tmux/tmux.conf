
##### =========================================
#####  GOTHAM NEON TMUX // BATMAN EDITION
#####  Optimized for multitasking + vi workflow
##### =========================================

##### --- CORE OPTIONS ---------------------------------

# Use Ctrl-a as prefix (muscle-memory friendly for shells/mux)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window & pane indices at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable truecolor & UTF-8
set -g default-terminal "screen-256color"
set -as terminal-overrides ",*:Tc"
set -g utf8 on

# Focus and interaction
set -g focus-events on
set -g history-limit 100000

# Mouse (toggle as desired)
set -g mouse on   # set to 'off' if you want pure keyboard

# Vi-style keys in copy/scrollback
setw -g mode-keys vi


##### --- THEME: GOTHAM + NEON -------------------------

# Palette (Batman + neon)
#   bg:     #05060A  (near-black)
#   gray:   #546e7a
#   light:  #b0bec5
#   yellow: #fdd835 (Bat-signal)
#   cyan:   #00e5ff (neon)
#   magenta:#ff4081 (neon warning)

# Status bar base
set -g status-position bottom
set -g status-interval 1
set -g status-justify centre

set -g status-style "bg=#05060A,fg=#b0bec5"

set -g status-left-length 40
set -g status-right-length 140

# LEFT: Session block (Batman badge)
set -g status-left "#[bg=#05060A,fg=#fdd835,bold]  #S #[default] "

# RIGHT: Prefix indicator + time/date
set -g status-right '#[fg=#ff4081]#{?client_prefix,⚡ , }#[default] #[fg=#00e5ff]%Y-%m-%d #[fg=#b0bec5]%H:%M '

# Windows (tabs)
setw -g window-status-format " #[fg=#546e7a]#I:#W#[default] "
setw -g window-status-style  "bg=#05060A,fg=#546e7a"

setw -g window-status-current-format " #[bg=#fdd835,fg=#05060A,bold]#I:#W#[default] "
setw -g window-status-current-style  "bg=#fdd835,fg=#05060A,bold"

# Pane borders: dim gray vs neon cyan for active
set -g pane-border-style        "fg=#1f2933"
set -g pane-active-border-style "fg=#00e5ff"

# Command/message styling (bottom prompts)
set -g message-style "bg=#ff4081,fg=#05060A,bold"
set -g message-command-style "bg=#00e5ff,fg=#05060A"

# Copy/selection mode (highlight zone)
setw -g mode-style "bg=#00e5ff,fg=#05060A,bold"

# Bell / activity flags (subtle neon ping)
setw -g window-status-bell-style "bg=#ff4081,fg=#05060A,bold"
setw -g window-status-activity-style "bg=#05060A,fg=#00e5ff,italics"


##### --- MULTITASKING LAYOUTS & PANE CONTROL ----------

# Splits: preserve working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Fast layouts
bind t select-layout tiled
bind e select-layout even-horizontal
bind E select-layout even-vertical

# Navigate panes with hjkl (vi-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes (rotate roles)
bind < swap-pane -U
bind > swap-pane -D

# Zoom current pane (focus mode)
bind z resize-pane -Z


##### --- WINDOWS & SESSIONS ---------------------------

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Cycling windows
bind -r n next-window
bind -r p previous-window

# Clean numbering
set -g renumber-windows on

# Quick session tree
bind s choose-tree -Zw

# Detach
bind d detach-client


##### --- COPY MODE / SYSTEM CLIPBOARD -----------------

# Enter copy mode with prefix + [
bind [ copy-mode

# Vi-style selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# If you use xclip / wl-copy, enable one of these:
# Linux X11 example (uncomment if desired):
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Wayland example:
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"


##### --- QUALITY-OF-LIFE TWEAKS -----------------------

# Allow repeating keys where marked -r above
set -g repeat-time 300

# Short command delay
set -sg escape-time 10

# Activity monitoring
setw -g monitor-activity on

# Bell off (Batman does not like noisy alerts)
set -g bell-action none


##### --- PLUGIN / LOCAL OVERRIDES (MODULAR HOOKS) ----

# TPM (Tmux Plugin Manager) optional
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# run '~/.tmux/plugins/tpm/tpm'

# Local user overrides (safe modular extension)
if-shell "[ -f ~/.tmux.local.conf ]" "source-file ~/.tmux.local.conf"
