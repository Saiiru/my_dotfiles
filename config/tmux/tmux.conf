#═══════════════════════════════════════════════════════════════════════
# TMUX CONFIGURATION
# Professional terminal multiplexer setup
# Author: Sairu
# https://github.com/Sairu/my_dotfiles
#═══════════════════════════════════════════════════════════════════════

#───────────────────────────────────────────────────────────────────────
# PREFIX & CORE SETTINGS
#───────────────────────────────────────────────────────────────────────

set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on

bind ß move-window -r

#───────────────────────────────────────────────────────────────────────
# DISPLAY & TERMINAL
#───────────────────────────────────────────────────────────────────────

set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

set-option -g display-time 3000
set-option -g escape-time 0
set-option -g focus-events on
set-option -s extended-keys on

#───────────────────────────────────────────────────────────────────────
# HISTORY & SESSION
#───────────────────────────────────────────────────────────────────────

set-option -g history-limit 100000
set-option -g detach-on-destroy off
set-option -g set-clipboard on

#───────────────────────────────────────────────────────────────────────
# WINDOW & PANE
#───────────────────────────────────────────────────────────────────────

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

bind-key x kill-pane
bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

#───────────────────────────────────────────────────────────────────────
# SESH SESSION MANAGER
#───────────────────────────────────────────────────────────────────────

bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --list-border --no-sort --prompt '⚡  ' --input-border --header-border \
    --bind 'tab:down,btab:up' --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' --preview 'sesh preview {}' \
)\""

bind-key "N" display-popup -E "sesh ui"

bind-key "R" run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --query  \"\$(sesh root)\" --list-border --no-sort --prompt '⚡  ' --input-border \
    --bind 'tab:down,btab:up' --bind 'ctrl-b:abort' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' --preview 'sesh preview {}' \
)\""

bind-key "Z" display-popup -E "sesh connect \$(sesh list | fzf --height 24)"
bind -N "Root session" 9 run-shell "sesh connect --root $(pwd)"
bind -N "Last session" L run-shell "sesh last || tmux display-message -d 1000 'Only one session'"

#───────────────────────────────────────────────────────────────────────
# QUICK ACTIONS
#───────────────────────────────────────────────────────────────────────

bind -N "AI assistant" A new-window -S -n '🤖' 'ai'
bind -N "Builder" b new-window -S -n '🔨' 'build'
bind -N "Dev environment" D new-window -S -n '🔧' 'dev'
bind -N "Editor" E new-window -S -n '📝' 'nvim +GoToFile'
bind -N "GitHub dash" G new-window -c "#{pane_current_path}" -n "😺" "ghd 2> /dev/null"
bind -N "Lazygit" g new-window -S -n '🌳' 'lazygit'
bind -N "Kill session" Q kill-session
bind -N "NPM script" Y split-window -v -l 10 "npm run (jq -r '.scripts | keys[]' package.json | fzf --no-border)"
bind -N "Break pane" B break-pane
bind -N "Join pane" J join-pane -t 1

#───────────────────────────────────────────────────────────────────────
# COLORS - CYBERPUNK THEME (matches Kitty)
#───────────────────────────────────────────────────────────────────────

# Cyberpunk neon palette
PINK="#FF2D95"
CYAN="#00F0FF"
PURPLE="#9A6CFF"
YELLOW="#FFD166"
GREEN="#7CFF00"
RED="#FF5555"
BLUE="#00CFFF"
MAGENTA="#FF6EC7"

# Backgrounds & neutrals
BG="#0B0A12"
SURFACE="#1A1A2E"
DARK="#141127"
LIGHT_GRAY="#4F4946"
TEXT="#F8F8F2"
MUTED="#6C7086"

# Nerd Font separators
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"

#───────────────────────────────────────────────────────────────────────
# STATUS BAR
#───────────────────────────────────────────────────────────────────────

set-option -g status-position top
set-option -g status-style bg=default,fg=${TEXT}
set-option -g status-interval 3
set-option -g status-justify centre

# Left: Session name
set-option -g status-left "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[bg=${LIGHT_GRAY},fg=${PINK},bold] #S \
#[fg=${LIGHT_GRAY},bg=default]${TRIANGLE_CLOSE}\
"
set-option -g status-left-length 300

# Right: Hostname
set-option -g status-right "\
#[fg=${LIGHT_GRAY},bg=default]${TRIANGLE_OPEN}\
#[bg=${LIGHT_GRAY},fg=${CYAN},bold] #h \
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"
set-option -g status-right-length 300

# Windows (inactive)
set-option -g window-status-format " #I#[fg=${PURPLE}]:#[fg=default]#W "

# Windows (active)
set-option -g window-status-current-format "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[bg=${LIGHT_GRAY},fg=default,bold]#I\
#[fg=${PINK}]:\
#[fg=${YELLOW},bold]#W\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"

set-option -g window-status-separator ""

#───────────────────────────────────────────────────────────────────────
# BORDERS & UI
#───────────────────────────────────────────────────────────────────────

set-option -g pane-active-border-style "fg=${PINK},bg=default"
set-option -g pane-border-style "fg=${MUTED},bg=default"

set-option -g allow-passthrough on
set-option -g message-style "bg=default,fg=${YELLOW}"
set-option -g message-command-style "bg=default,fg=${YELLOW}"
set-option -g mode-style "bg=${PURPLE},fg=${BG}"

#───────────────────────────────────────────────────────────────────────
# PLUGINS
#───────────────────────────────────────────────────────────────────────

set -g @floax-bind H
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @tmux-nerd-font-window-name-shell-icon ''
set -g @tmux-nerd-font-window-name-show-name false

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'joshmedeski/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# TPM initialization (standard location)
run '~/.tmux/plugins/tpm/tpm'
