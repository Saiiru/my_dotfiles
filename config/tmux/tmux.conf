# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# tmux.conf — Watch_Dogs // Catppuccin Ops Stack
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if-shell '[ -f ~/.config/tmux/tmux.reset.conf ]' 'source-file ~/.config/tmux/tmux.reset.conf'

set-option -g default-terminal 'tmux-256color'
set-option -ga terminal-overrides ',xterm-256color:RGB'

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g set-clipboard on
set -g mouse on
set -g focus-events on
set -g status-position top
set -g status-interval 1
set -g status-justify centre
setw -g mode-keys vi
set -g display-time 2500
set -g allow-passthrough on

set -g pane-border-style 'fg=#2b3632'
set -g pane-active-border-style 'fg=#f0f5f2'
set -g message-style 'bg=#111416,fg=#40f3c2,bold'
set -g message-command-style 'bg=#111416,fg=#40f3c2,bold'
set -g mode-style 'bg=#1b2422,fg=#40f3c2,bold'

# ── Window + pane management ──────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux :: reloaded'
bind b run-shell '$HOME/dotfiles/config/tmux/scripts/toggle-status.sh'
bind H previous-window
bind L next-window
bind C-a last-window
bind W list-windows

bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r , resize-pane -L 6
bind -r . resize-pane -R 6
bind -r '_' resize-pane -D 5
bind -r '+' resize-pane -U 5
bind z resize-pane -Z
bind x kill-pane
bind q confirm-before -p 'kill pane #P?' kill-pane
bind Q confirm-before -p 'kill window #W?' kill-window
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ── Popups / Workflow ─────────────────────────────────────────────
bind K display-popup -w 88% -h 85% -E "tmux choose-tree -N -Z -F '#{session_name} ▕ #{window_index}:#{window_name} ▕ #{pane_current_path}'"
bind S display-popup -w 85% -h 80% -E 'tmux-sessionx'
bind G display-popup -w 70% -h 70% -E '~/.config/tmux/scripts/grimorio-popup.sh'
bind T display-popup -w 90% -h 80% -E '~/.config/tmux/scripts/taskw-board.sh'
bind t display-popup -w 90% -h 85% -E '$HOME/dotfiles/bin/watchdogs-tasks'
bind P display-popup -w 75% -h 70% -E '$HOME/dotfiles/config/tmux/scripts/pomodoro.sh popup'
bind-key C-t display-popup -w 80% -h 75% -E '$HOME/dotfiles/bin/watchdogs-tasks'

bind-key -n C-S-p run-shell '$HOME/dotfiles/config/tmux/scripts/pomodoro.sh toggle 25'
bind-key -n C-S-b run-shell '$HOME/dotfiles/config/tmux/scripts/pomodoro.sh break 5'
bind-key -n C-S-s run-shell '$HOME/dotfiles/config/tmux/scripts/pomodoro.sh stop'

# ── Plugins ───────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @thumbs-key 'C-A'
set -g @thumbs-command 'wl-copy'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="  " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#40f3c2'
set -g @floax-text-color '#f0f5f2'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind 'O'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths '$HOME $HOME/Projects $HOME/dotfiles'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator ''
set -g @catppuccin_window_right_separator ''
set -g @catppuccin_status_left_separator ' '
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_status_right_separator_inverse 'no'
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_status_modules_left 'session'
set -g @catppuccin_status_modules_right 'directory date_time'
set -g @catppuccin_directory_text '#{b:pane_current_path}'
set -g @catppuccin_date_time_text '%Y-%m-%d %H:%M'

run '~/.tmux/plugins/tpm/tpm'

# ── HUD overrides (Watch_Dogs neon) ───────────────────────────────
set -g status-style 'bg=#050707,fg=#9cf3d1'
set -g window-status-style 'bg=#050707,fg=#6d7a75'
set -g window-status-current-style 'bg=#1affb0,fg=#04110c,bold'
set -g status-left-length 80
set -g status-right-length 180
set -g status-left '#[fg=#1affb0,bg=#050707,bold]◢ #[fg=#f0f5f2]#S #[fg=#27413a]┃ #[fg=#8bd7bf]#(~/dotfiles/config/tmux/scripts/gitmux.sh 2>/dev/null) '
set -g window-status-separator ' '
set -g window-status-format '#[fg=#3f4a46] [ #I:#W ] '
set -g window-status-current-format '#[bg=#1affb0,fg=#04110c] [ #I:#W ] #[bg=#050707,fg=#3f4a46]'
set -g status-right '#(~/dotfiles/config/tmux/scripts/pomodoro.sh status) #[fg=#3f4a46]┃ #(~/dotfiles/config/tmux/scripts/taskw-summary.sh) #[fg=#3f4a46]┃ %H:%M '
