# tmux 3.4+ · Evil Eye / Batman Flat Theme
# Prefix: C-a | Mouse on | No plugins

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g renumber-windows on
set -g status-keys vi
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'

# Palette
set -g @fg        "#cfd8e3"
set -g @dim       "#5c6773"
set -g @blue      "#51afef"
set -g @cyan      "#00cfff"
set -g @pink      "#ff6ec7"
set -g @green     "#98be65"
set -g @yellow    "#ECBE7B"
set -g @bg        "default"

# Statusline base (flat)
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify centre
set -g status-style "bg=#{@bg},fg=#{@fg}"
set -g status-left-length 40
set -g status-right-length 120

# Left: bat icon + session (flat)
set -g status-left '#[fg=#{@blue}] #[fg=#{@fg}]#S '

# Window list (flat, activity flags, zoom/sync inline)
set -g window-status-separator "  "
set -g window-status-format '#[fg=#{@dim}]#I:#W#{?window_activity_flag,*,}#{?window_last_flag,!,}'
set -g window-status-current-format '#[fg=#{@blue},bold]#I:#W#{?window_zoomed_flag,[Z],}#{?pane_synchronized,[S],}'

# Pane borders
set -g pane-border-style "fg=#{@dim}"
set -g pane-active-border-style "fg=#{@blue}"

# Messages / copy mode
set -g message-style "bg=#{@blue},fg=#{@bg},bold"
set -g mode-style "bg=#{@cyan},fg=#{@bg},bold"

# Right: cpu mem batt clock date session (avoid nested quotes)
set -g status-right '#(command -v vmstat >/dev/null 2>&1 && vmstat 1 2 | tail -1 | awk '\''{printf "cpu %s%%",100-$15}'\'') #[fg=#{@dim}]· #(command -v free >/dev/null 2>&1 && free -h | awk "/Mem:/ {print \"mem \"\$3\"/\"\$2\""}") #[fg=#{@dim}]· #(command -v acpi >/dev/null 2>&1 && acpi -b | head -n1 | sed "s/.*, //") #[fg=#{@dim}]· #[fg=#{@pink}]%H:%M #[fg=#{@dim}]· #[fg=#{@yellow}]%Y-%m-%d #[fg=#{@dim}]· #[fg=#{@fg}]#S '

# Toggle statusline (Prefix + E)
bind E if -F '#{==:#{status},on}' 'set -g status off' 'set -g status on'

# Splits same directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload
bind r source-file ~/.tmux.conf \; display "tmux reloaded"

# Keep defaults for navigation/resizing
