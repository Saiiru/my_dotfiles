##############################################
# KITTY BASE CONFIGURATION (foundations)
# File: ~/.config/kitty/base.conf
##############################################

# Fonts
font_family      DankMono Nerd Font
bold_font        DankMono Nerd Font Bold
italic_font      DankMono Nerd Font Italic
bold_italic_font DankMono Nerd Font Bold Italic
font_size        11.5
disable_ligatures never

# Cursor
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0

# URL / selection
mouse_hide_wait 0.5
url_color #44e6ff
url_style curly
detect_urls yes
open_url_with default
copy_on_select no
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#
paste_actions quote-urls-at-prompt
show_hyperlink_targets yes

# Mouse mappings
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left press ungrabbed mouse_selection normal
mouse_map right press ungrabbed copy_to_clipboard

# Terminal protocol
term xterm-kitty
shell zsh
shell_integration enabled

# Window management
remember_window_size yes
initial_window_width  1600
initial_window_height 900
window_padding_width 14
window_border_width 1.0pt
draw_minimal_borders yes
hide_window_decorations yes
single_window_margin_width 0
enabled_layouts tall,fat,grid,stack
window_resize_step_cells 2
window_resize_step_lines 2
visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{'🇿' if layout_name == 'stack' and num_windows > 1 else ''}{title}"

# Audio / bells
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab yes

# Performance
epaint_delay 10
input_delay 3
sync_to_monitor yes

# Remote control
allow_remote_control yes
# listen_on unix:@kitty-{kitty_pid}  # opcional, ative se quiser sockets nomeados

# Session
startup_session none
allow_hyperlinks yes

# Confirmation thresholds
confirm_os_window_close -1
confirm_exit 0
