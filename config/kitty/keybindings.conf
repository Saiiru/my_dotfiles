########################################################
# KITTY KEYBINDINGS – BATMAN WORKSTATION
# kitty_mod = ctrl+shift (ergonomia estilo tmux)
########################################################

kitty_mod ctrl+shift

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map shift+insert paste_from_selection

# Scrollback
map kitty_mod+/ launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac
map kitty_mod+f show_scrollback
map kitty_mod+up    scroll_line_up
map kitty_mod+down  scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end  scroll_end

# Tabs
map kitty_mod+t new_tab_with_cwd
map kitty_mod+q close_tab
map kitty_mod+] next_tab
map kitty_mod+[ previous_tab
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward

# Janelas
map kitty_mod+enter new_window_with_cwd
map kitty_mod+n     new_os_window_with_cwd
map kitty_mod+w     close_window

# Splits
map kitty_mod+minus      launch --location=hsplit --cwd=current
map kitty_mod+backslash  launch --location=vsplit --cwd=current
# Splits alternativos sem colidir com paste
# (mantém ctrl+shift+v para colar)
map kitty_mod+shift+minus      launch --location=hsplit --cwd=current
map kitty_mod+shift+backslash  launch --location=vsplit --cwd=current

# Navegação de janelas (vim-style)
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down

# Mover janelas
map shift+left  move_window left
map shift+right move_window right
map shift+up    move_window up
map shift+down  move_window down

# Redimensionar
map kitty_mod+r start_resizing_window
map alt+left  resize_window narrower
map alt+right resize_window wider
map alt+up    resize_window taller
map alt+down  resize_window shorter
map alt+n resize_window narrower
map alt+w resize_window wider
map alt+t resize_window taller
map alt+s resize_window shorter
map ctrl+home resize_window reset

# Layouts
map kitty_mod+l next_layout
map kitty_mod+z toggle_layout stack
map kitty_mod+m kitten zoom_toggle.py

# Fonte / Opacidade
map ctrl+equal       change_font_size all +2.0
map ctrl+plus        change_font_size all +2.0
map ctrl+kp_add      change_font_size all +2.0
map ctrl+minus       change_font_size all -2.0
map ctrl+kp_subtract change_font_size all -2.0
map ctrl+0 change_font_size all 0
map kitty_mod+o       change_background_opacity +0.05
map kitty_mod+shift+o change_background_opacity -0.05

# Config
map f5 load_config_file
map f6 launch --type=tab --cwd=~/.config/kitty nvim kitty.conf
map f11 toggle_fullscreen
map ctrl+q quit

# Hints (URL/path extraction)
map f3 kitten hints --alphabet asdfqwerzxcvjklmiuopghtybn1234567890 --customize-processing custom-hints.py
map kitty_mod+y kitten hints --program @
