########################################################
# KITTY INTEGRATIONS – BAT-WORKSTATION
# Overlays para HUD, projetos, tmux, utilitários
########################################################

# HUD overlay (Ctrl+Shift+G) – usa zsh -ic para carregar PATH/.zshrc
map kitty_mod+g launch --type=overlay --cwd=current zsh -ic 'bat-hud; echo; echo "Press ENTER to close..."; read -k1'

# Project picker (Ctrl+Shift+P) – zoxide + fzf
map kitty_mod+p launch --type=overlay zsh -ic 'if ! command -v zoxide >/dev/null || ! command -v fzf >/dev/null; then echo "ERROR: zoxide e fzf são necessários"; echo; read -k1; exit 1; fi; dest=$(zoxide query -l | fzf --height=100% --reverse --prompt="🦇 BAT-PROJ > " --preview="ls -lah {} 2>/dev/null | head -20" --preview-window=right:50%:wrap --color="border:#dc143c,prompt:#ff073a,pointer:#22e3b3"); if [ -n "$dest" ]; then kitty @ launch --type=tab --cwd="$dest"; fi; echo; read -k1 -p "Press any key to close..."'

# Tmux layout orchestrator (Ctrl+Shift+S)
map kitty_mod+s launch --type=overlay --cwd=current zsh -ic 'if [[ -z "$TMUX" ]]; then echo "⚠️  TMUX não detectado. Abra uma sessão tmux: tmux new -A -s dev"; echo; read -k1; exit 1; fi; bat-tmux-layout; echo; read -k1 -p "Press any key to close..."'

# File browser (Ctrl+Shift+E) – yazi
map kitty_mod+e launch --type=overlay --cwd=current zsh -ic 'if command -v yazi >/dev/null; then yazi; else echo "yazi não instalado (pacman -S yazi)"; read -k1; fi'

# Git TUI (Ctrl+Shift+Alt+G) – lazygit
map kitty_mod+alt+g launch --type=overlay --cwd=current zsh -ic 'if command -v lazygit >/dev/null; then lazygit; else echo "lazygit não instalado (yay -S lazygit)"; read -k1; fi'

# New project (Ctrl+Shift+N)
map kitty_mod+shift+n launch --type=overlay zsh -ic 'bat-new-project; echo; read -k1 -p "Press any key to close..."'

# System diagnostics (Ctrl+Shift+D)
map kitty_mod+d launch --type=overlay zsh -ic 'echo "🩺 BAT-WORKSTATION DIAGNOSTICS"; echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"; echo; mise doctor; echo; echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"; read -k1 -p "Press any key to close..."'
