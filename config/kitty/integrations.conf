# BAT-WORKSTATION INTEGRATIONS (safe quoting)

# HUD overlay (Ctrl+Shift+G)
map ctrl+shift+g launch --type=overlay --cwd=current --hold zsh -lc 'PATH="$HOME/.local/bin:$PATH"; bat-hud'

# Project picker (Ctrl+Shift+P) — usa helper script
map ctrl+shift+p launch --type=overlay --cwd=current --hold zsh -lc 'PATH="$HOME/.local/bin:$PATH"; bat-project-picker'

# Layout manager (Ctrl+Shift+S) — kitty-native
map ctrl+shift+s launch --type=overlay --cwd=current --hold zsh -lc 'PATH="$HOME/.local/bin:$PATH"; bat-kitty-layout || true'

# New project wizard (Ctrl+Shift+N)
map ctrl+shift+n launch --type=overlay --cwd=current --hold zsh -lc 'PATH="$HOME/.local/bin:$PATH"; bat-new-project'

# File browser (Ctrl+Shift+E)
map ctrl+shift+e launch --type=overlay --cwd=current --hold zsh -lc 'if command -v yazi >/dev/null; then yazi; else echo "Instale yazi (sudo pacman -S yazi)"; read -k1; fi'

# Git TUI (Ctrl+Shift+Alt+G)
map ctrl+shift+alt+g launch --type=overlay --cwd=current --hold zsh -lc 'if command -v lazygit >/dev/null; then lazygit; else echo "Instale lazygit (yay -S lazygit)"; read -k1; fi'

# Diagnostics (Ctrl+Shift+D)
map ctrl+shift+d launch --type=overlay --cwd=current --hold zsh -lc 'PATH="$HOME/.local/bin:$PATH"; echo "🩺 BAT-WORKSTATION DIAGNOSTICS"; echo "-------------------------------"; mise doctor 2>/dev/null || echo "mise não encontrado"; echo; echo "Scripts:"; for s in bat-hud bat-new-project bat-kitty-layout bat-project-picker; do if command -v $s >/dev/null; then echo "  ✓ "$s; else echo "  ✗ "$s; fi; done; echo; echo "BAT_HOME: ${BAT_HOME:-not set}"; if [[ -d "$BAT_HOME" ]]; then echo "  ✓ dir existe"; else echo "  ✗ dir ausente"; fi'
