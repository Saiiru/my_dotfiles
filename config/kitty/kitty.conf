#═══════════════════════════════════════════════════════════════════════
# WORKSTATION OPS — Kitty Terminal Configuration
# High-performance terminal with neon aesthetics
#═══════════════════════════════════════════════════════════════════════

#───────────────────────────────────────────────────────────────────────
# FONTS
#───────────────────────────────────────────────────────────────────────

font_family      DankMono Nerd Font
bold_font        DankMono Nerd Font Bold
italic_font      DankMono Nerd Font Italic
bold_italic_font DankMono Nerd Font Italic

font_size 12.5
disable_ligatures never

adjust_line_height  0
adjust_column_width 0

#───────────────────────────────────────────────────────────────────────
# SYMBOL FALLBACK MAPS (Symbols Nerd Font Mono)
#───────────────────────────────────────────────────────────────────────

symbol_map U+E5FA-U+E62B Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono
symbol_map U+F000-U+F2E0 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+F400-U+F532 Symbols Nerd Font Mono
symbol_map U+2665 Symbols Nerd Font Mono
symbol_map U+26A1 Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0A2 Symbols Nerd Font Mono
symbol_map U+E0B0-U+E0B3 Symbols Nerd Font Mono
symbol_map U+E0B4-U+E0C8 Symbols Nerd Font Mono
symbol_map U+E0CC-U+E0D4 Symbols Nerd Font Mono
symbol_map U+E0A3 Symbols Nerd Font Mono
symbol_map U+E0CA Symbols Nerd Font Mono
symbol_map U+23FB-U+23FE Symbols Nerd Font Mono
symbol_map U+2B58 Symbols Nerd Font Mono
symbol_map U+F300-U+F32F Symbols Nerd Font Mono
symbol_map U+E000-U+E00A Symbols Nerd Font Mono
symbol_map U+EA60-U+EBEB Symbols Nerd Font Mono
symbol_map U+E276C-U+E2771 Symbols Nerd Font Mono
symbol_map U+2500-U+259F Symbols Nerd Font Mono

#═══════════════════════════════════════════════════════════════════════
# NEON VIGILANTE COLOR PALETTE
#═══════════════════════════════════════════════════════════════════════

# Background & Foreground (Cyberdream Batman)
background_opacity      0.92
dynamic_background_opacity yes
background_blur         12
# Uncomment the following lines if you have the bat-symbol silhouette image
# Batman splash background
background_image        ~/workstation/config/kitty/backgrounds/batman-red-hood.png
background_image_layout scaled
background_image_linear yes
background_tint         0.15

# Cursor
# cursor                  #ff073a
# cursor_text_color       #000000
cursor_shape            block
cursor_blink_interval   0.6
cursor_stop_blinking_after 15.0

# URL
# url_color               #00ffff
url_style               curly

# Borders
# active_border_color     #ff073a
# inactive_border_color   #1a1a1a
# bell_border_color       #ff6600

include cyberdream-colors.conf

#═══════════════════════════════════════════════════════════════════════
# WINDOW & LAYOUT
#═══════════════════════════════════════════════════════════════════════

remember_window_size  yes
initial_window_width  1600
initial_window_height 1000

# window padding/borders tuned for Batman synthwave vibe
window_padding_width 8
window_border_width 1
draw_minimal_borders yes
window_margin_width 0 2 2 2
single_window_margin_width 0 2 2 2

placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0

#═══════════════════════════════════════════════════════════════════════
# TAB BAR (hidden - Tmux gerencia)
#═══════════════════════════════════════════════════════════════════════

tab_bar_style hidden

#═══════════════════════════════════════════════════════════════════════
# PERFORMANCE
#═══════════════════════════════════════════════════════════════════════

repaint_delay   5
input_delay     1
sync_to_monitor yes

#═══════════════════════════════════════════════════════════════════════
# BEHAVIOR
#═══════════════════════════════════════════════════════════════════════

shell_integration   enabled
allow_remote_control yes
listen_on           unix:/tmp/kitty

copy_on_select yes
strip_trailing_spaces smart

scrollback_lines 10000
wheel_scroll_multiplier 5.0

mouse_hide_wait 2.0
url_prefixes http https file ftp ftps git
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks hover

enable_audio_bell no
visual_bell_duration 0.1
# visual_bell_color #ff073a
window_alert_on_bell yes

#═══════════════════════════════════════════════════════════════════════
# KEYBINDINGS
#═══════════════════════════════════════════════════════════════════════

kitty_mod ctrl+shift

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# Font size
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Opacity
map ctrl+shift+9 set_background_opacity -0.05
map ctrl+shift+8 set_background_opacity +0.05
map ctrl+shift+0 set_background_opacity 1.0

# Reload & Fullscreen
map f5 load_config_file
map f11 toggle_fullscreen

# Search
map kitty_mod+/ launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --exact -i
map kitty_mod+enter launch --type=os-window --cwd=current
map kitty_mod+shift+enter launch --type=tab --cwd=current
map kitty_mod+d launch --type=overlay --stdin-source=@screen_scrollback less --RAW-CONTROL-CHARS
map ctrl+shift+l show_scrollback
map kitty_mod+b launch --type=overlay --stdin-source=@screen_scrollback bat --paging always

#═══════════════════════════════════════════════════════════════════════
# TMUX INTEGRATION
#═══════════════════════════════════════════════════════════════════════

term xterm-256color
allow_hyperlinks yes

# Deixa Tmux gerenciar tabs/windows
map ctrl+shift+t no_op
map ctrl+shift+w no_op
map ctrl+shift+q no_op

#═══════════════════════════════════════════════════════════════════════
# OS SPECIFIC
#═══════════════════════════════════════════════════════════════════════

linux_display_server auto
# wayland_titlebar_color background
wayland_enable_ime yes

#═══════════════════════════════════════════════════════════════════════
# LAYOUT
#═══════════════════════════════════════════════════════════════════════

enabled_layouts splits,stack


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
#───────────────────────────────────────────────────────────────────────
# TMUX INTEGRATION
#───────────────────────────────────────────────────────────────────────

# Launch tmux with Ctrl+Shift+T
map ctrl+shift+t launch --type=os-window --cwd=current tmux new-session -A -s main

# Alternative: Launch tmux in new window
map ctrl+alt+t new_window tmux new-session -A -s work

# Launch tmux with session selector
map ctrl+shift+alt+t launch --type=os-window tmux attach || tmux new-session
