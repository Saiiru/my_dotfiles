# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  NEON-NIRI v2 - KITTY CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

font_family      DankMono Nerd Font
bold_font        DankMono Nerd Font Bold
italic_font      DankMono Nerd Font Italic
bold_italic_font DankMono Nerd Font Italic
font_size 11.0

symbol_map U+E5FA-U+E62B Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono
symbol_map U+F000-U+F2E0 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+F400-U+F532 Symbols Nerd Font Mono
symbol_map U+2665 Symbols Nerd Font Mono
symbol_map U+26A1 Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0A2 Symbols Nerd Font Mono
symbol_map U+E0B0-U+E0B3 Symbols Nerd Font Mono
symbol_map U+E0B4-U+E0C8 Symbols Nerd Font Mono
symbol_map U+E0CC-U+E0D4 Symbols Nerd Font Mono
symbol_map U+E0A3 Symbols Nerd Font Mono
symbol_map U+E0CA Symbols Nerd Font Mono
symbol_map U+23FB-U+23FE Symbols Nerd Font Mono
symbol_map U+2B58 Symbols Nerd Font Mono
symbol_map U+F300-U+F32F Symbols Nerd Font Mono
symbol_map U+E000-U+E00A Symbols Nerd Font Mono
symbol_map U+EA60-U+EBEB Symbols Nerd Font Mono
symbol_map U+E276C-U+E2771 Symbols Nerd Font Mono
symbol_map U+2500-U+259F Symbols Nerd Font Mono

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

mouse_hide_wait 2.0
url_style curly
open_url_with default
detect_urls yes

enable_audio_bell no
visual_bell_duration 0.0

remember_window_size  yes
initial_window_width  1200
initial_window_height 800
window_padding_width 8
placement_strategy center

term xterm-256color
shell zsh
editor nvim

allow_remote_control yes
listen_on unix:/tmp/kitty

# Dracula palette
foreground            #f8f8f2
background            #282a36
selection_foreground  #ffffff
selection_background  #44475a
url_color             #8be9fd
color0  #21222c
color8  #6272a4
color1  #ff5555
color9  #ff6e6e
color2  #50fa7b
color10 #69ff94
color3  #f1fa8c
color11 #ffffa5
color4  #bd93f9
color12 #d6acff
color5  #ff79c6
color13 #ff92df
color6  #8be9fd
color14 #a4ffff
color7  #f8f8f2
color15 #ffffff

repaint_delay 10
input_delay 3
sync_to_monitor yes

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+enter new_window
map ctrl+shift+n new_os_window
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

kitty_mod ctrl+shift
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+t new_tab
map kitty_mod+w close_tab
map kitty_mod+enter new_window
map kitty_mod+n new_os_window
map ctrl+shift+l show_scrollback
map f5 load_config_file
map f11 toggle_fullscreen

wayland_titlebar_color background
linux_display_server wayland
