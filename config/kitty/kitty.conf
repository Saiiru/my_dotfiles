#═══════════════════════════════════════════════════════════════════════
# GOTHAM SYSTEM — Kitty Terminal Configuration
# High-performance terminal with neon aesthetics
#═══════════════════════════════════════════════════════════════════════

#───────────────────────────────────────────────────────────────────────
# FONTS
#───────────────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 12.0
disable_ligatures never

adjust_line_height  0
adjust_column_width 0

#═══════════════════════════════════════════════════════════════════════
# NEON VIGILANTE COLOR PALETTE
#═══════════════════════════════════════════════════════════════════════

# Background & Foreground
# foreground              #00ff00
# background              #000000
background_opacity      0.92
# background_blur         12

background_opacity      0.88
background_blur         8
background_image        ~/gotham/terminal/kitty/backgrounds/redhoodlogo2-soft.png
background_image_layout cscaled
# selection_foreground    #000000
# selection_background    #00ff00

# Cursor
# cursor                  #ff073a
# cursor_text_color       #000000
cursor_shape            block
cursor_blink_interval   0.5
cursor_stop_blashing_after 15.0

# URL
# url_color               #00ffff
url_style               curly

# Borders
# active_border_color     #ff073a
# inactive_border_color   #1a1a1a
# bell_border_color       #ff6600

#───────────────────────────────────────────────────────────────────────
# COLOR PALETTE (16 colors - ANSI)
#───────────────────────────────────────────────────────────────────────

# Black
# color0  #000000
# color8  #1a1a1a

# Red (errors)
# color1  #ff073a
# color9  #ff3366

# Green (success)
# color2  #00ff00
# color10 #00ff66

# Yellow (warnings)
# color3  #ffff00
# color11 #ffff66

# Blue (info)
# color4  #0099ff
# color12 #00ccff

# Magenta (debug)
# color5  #ff00ff
# color13 #ff66ff

# Cyan (info secondary)
# color6  #00ffff
# color14 #66ffff

# White
# color7  #ffffff
# color15 #ffffff

#═══════════════════════════════════════════════════════════════════════
# WINDOW & LAYOUT
#═══════════════════════════════════════════════════════════════════════

remember_window_size  yes
initial_window_width  1600
initial_window_height 1000

window_padding_width 4
window_border_width 2
draw_minimal_borders yes
window_margin_width 2
single_window_margin_width 2

placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0

#═══════════════════════════════════════════════════════════════════════
# TAB BAR (hidden - Tmux gerencia)
#═══════════════════════════════════════════════════════════════════════

tab_bar_style hidden

#═══════════════════════════════════════════════════════════════════════
# PERFORMANCE
#═══════════════════════════════════════════════════════════════════════

repaint_delay   5
input_delay     1
sync_to_monitor yes

#═══════════════════════════════════════════════════════════════════════
# BEHAVIOR
#═══════════════════════════════════════════════════════════════════════

shell_integration   enabled
allow_remote_control yes
listen_on           unix:/tmp/kitty

copy_on_select yes
strip_trailing_spaces smart

scrollback_lines 10000
wheel_scroll_multiplier 5.0

mouse_hide_wait 2.0
url_prefixes http https file ftp ftps git
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks hover

enable_audio_bell no
visual_bell_duration 0.1
# visual_bell_color #ff073a
window_alert_on_bell yes

#═══════════════════════════════════════════════════════════════════════
# KEYBINDINGS
#═══════════════════════════════════════════════════════════════════════

kitty_mod ctrl+shift

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# Font size
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Opacity
map ctrl+shift+9 set_background_opacity -0.05
map ctrl+shift+8 set_background_opacity +0.05
map ctrl+shift+0 set_background_opacity 1.0

# Reload & Fullscreen
map f5 load_config_file
map f11 toggle_fullscreen

# Search
map kitty_mod+/ launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --exact -i

#═══════════════════════════════════════════════════════════════════════
# TMUX INTEGRATION
#═══════════════════════════════════════════════════════════════════════

term xterm-256color
allow_hyperlinks yes

# Deixa Tmux gerenciar tabs/windows
map ctrl+shift+t no_op
map ctrl+shift+w no_op
map ctrl+shift+q no_op

#═══════════════════════════════════════════════════════════════════════
# OS SPECIFIC
#═══════════════════════════════════════════════════════════════════════

linux_display_server auto
# wayland_titlebar_color background
wayland_enable_ime yes

#═══════════════════════════════════════════════════════════════════════
# LAYOUT
#═══════════════════════════════════════════════════════════════════════

enabled_layouts splits,stack


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME