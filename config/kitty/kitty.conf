# RED HOOD CYBERPUNK – Kitty

# Fonts (instale via bin/sys/bat_font_install)
font_family      DankMono Nerd Font
bold_font        DankMono Nerd Font Bold
italic_font      DankMono Nerd Font Italic
bold_italic_font DankMono Nerd Font Bold Italic
font_size 11.5
disable_ligatures never

# Colors
foreground #e6edf3
background #0a0b0d
background_opacity 0.92
selection_foreground #0a0b0d
selection_background #dc143c
cursor #ff073a
cursor_text_color #0a0b0d

color0  #0a0b0d
color1  #dc143c
color2  #22e3b3
color3  #facc15
color4  #22d3ee
color5  #7c3aed
color6  #ee79d1
color7  #e6edf3
color8  #1f232a
color9  #ff073a
color10 #44f7c5
color11 #ffd95a
color12 #44e6ff
color13 #a98bff
color14 #ff9eeb
color15 #ffffff

# Layout / window
remember_window_size yes
initial_window_width  1600
initial_window_height 900
window_padding_width 14
window_border_width 1.0
draw_minimal_borders yes
hide_window_decorations yes

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
active_tab_foreground   #000000
active_tab_background   #dc143c
inactive_tab_foreground #666666
inactive_tab_background #1f232a

# Behavior
shell zsh
term xterm-256color
scrollback_lines 10000
mouse_hide_wait 0.5
detect_urls yes
open_url_with default
enable_audio_bell no
visual_bell_duration 0

# Keybindings (kitty_mod = ctrl+shift)
kitty_mod ctrl+shift
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+t new_tab_with_cwd
map kitty_mod+q close_tab
map kitty_mod+enter new_window_with_cwd
map kitty_mod+n new_os_window_with_cwd
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f11 toggle_fullscreen
map kitty_mod+/ launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0
map f5 load_config_file
