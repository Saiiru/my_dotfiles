# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ~/.config/kitty/kitty.conf
# RED HOOD CYBERPUNK THEME - Complete Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ═══════════════════════════════════════════════════════════════════
# FONTS - GeistMono Nerd Font (NF)
# ═══════════════════════════════════════════════════════════════════
font_family      GeistMono Nerd Font
bold_font        GeistMono Nerd Font Bold
italic_font      GeistMono Nerd Font Italic
bold_italic_font GeistMono Nerd Font Bold Italic

font_size 11.0

# Font features
disable_ligatures never

# Adjustments
adjust_line_height  0
adjust_column_width 0
adjust_baseline 0

# ═══════════════════════════════════════════════════════════════════
# RED HOOD CYBERPUNK COLOR PALETTE
# ═══════════════════════════════════════════════════════════════════

# Background & Foreground
foreground              #e6edf3
background              #0a0b0d
background_opacity      0.88
background_blur         8
background_image        ~/dotfiles/config/kitty/backgrounds/redhoodlogo2-soft.png
background_image_layout cscaled
background_image_alignment bottom
background_image_opacity 0.02
background_image_tint #0a0b0dcc

selection_foreground    #0a0b0d
selection_background    #dc143c

# Cursor
cursor                  #ff073a
cursor_text_color       #0a0b0d
cursor_shape            block
cursor_blink_interval   0
cursor_stop_blinking_after 0

# URL underline
url_color               #22d3ee
url_style               curly

# Border colors
active_border_color     #dc143c
inactive_border_color   #1f232a
bell_border_color       #ff6600

tab_bar_style           hidden

# Mark colors
mark1_foreground #0a0b0d
mark1_background #22d3ee
mark2_foreground #0a0b0d
mark2_background #22e3b3
mark3_foreground #0a0b0d
mark3_background #facc15

# ─── Color Palette ───

# Black
color0  #0a0b0d
color8  #1f232a

# Red
color1  #dc143c
color9  #ff073a

# Green
color2  #22e3b3
color10 #44f7c5

# Yellow
color3  #facc15
color11 #ffd95a

# Blue
color4  #22d3ee
color12 #44e6ff

# Magenta
color5  #7c3aed
color13 #a98bff

# Cyan
color6  #ee79d1
color14 #ff9eeb

# White
color7  #e6edf3
color15 #ffffff

# ═══════════════════════════════════════════════════════════════════
# WINDOW LAYOUT
# ═══════════════════════════════════════════════════════════════════
remember_window_size  yes
initial_window_width  1400
initial_window_height 900

window_padding_width 0
window_border_width 0
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width 0

placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0

# Window title
window_logo_path none
window_logo_position bottom-right
window_logo_alpha 0.0
window_logo_size 0

# ═══════════════════════════════════════════════════════════════════
# TAB BAR - Powerline Style
# ═══════════════════════════════════════════════════════════════════
# tab_bar_edge            top
# tab_bar_style           powerline
# tab_powerline_style     slanted
# tab_bar_align           left
# tab_bar_min_tabs        1
# tab_activity_symbol     🔥
# tab_title_template "{fmt.bg=#14161e}{fmt.fg=#22d3ee}{fmt.bg=#14161e}{fmt.fg=#e6edf3} {index}:{title[:18]}{title[18:] and '…'} {fmt.reset}"
# active_tab_title_template "{fmt.bg=#ff073a}{fmt.fg=#050505}{fmt.bg=#ff073a}{fmt.fg=#050505}🦇 {index}:{title[:22]}{title[22:] and '…'} {fmt.reset}"
#
# ═══════════════════════════════════════════════════════════════════
# PERFORMANCE
# ═══════════════════════════════════════════════════════════════════
repaint_delay   7
input_delay     1
sync_to_monitor yes

# ═══════════════════════════════════════════════════════════════════
# BEHAVIOR
# ═══════════════════════════════════════════════════════════════════
shell_integration   enabled
allow_remote_control yes
listen_on           unix:/tmp/kitty

# Clipboard
copy_on_select yes
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 1.0

# Mouse
mouse_hide_wait 0.0
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks hover

# Bell
enable_audio_bell no
visual_bell_duration 0.0
visual_bell_color none
window_alert_on_bell yes
bell_on_tab "🔔 "
command_on_bell none
bell_path none

# ═══════════════════════════════════════════════════════════════════
# KEYBINDINGS - Red Hood Style
# ═══════════════════════════════════════════════════════════════════
kitty_mod ctrl+shift
clear_all_shortcuts no

# ─── Clipboard ───
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map shift+insert paste_from_selection

# ─── Windows ───
map kitty_mod+enter new_window_with_cwd
map kitty_mod+shift+t launch --type=window --cwd=current $HOME/dotfiles/bin/watchdogs-tmux
map kitty_mod+w close_window
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward
map kitty_mod+` move_window_to_top
map kitty_mod+r start_resizing_window
map kitty_mod+1 first_window
map kitty_mod+2 second_window
map kitty_mod+3 third_window
map kitty_mod+4 fourth_window
map kitty_mod+5 fifth_window

# ─── Tabs ───
map kitty_mod+t new_tab_with_cwd
map kitty_mod+q close_tab
map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward
map kitty_mod+alt+t set_tab_title
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# ─── Layouts ───
map kitty_mod+l next_layout
map kitty_mod+alt+l last_used_layout
map kitty_mod+z toggle_layout stack

# ─── Font Size ───
map ctrl+equal  change_font_size all +2.0
map ctrl+plus   change_font_size all +2.0
map ctrl+kp_add change_font_size all +2.0
map ctrl+minus  change_font_size all -2.0
map ctrl+kp_subtract change_font_size all -2.0
map ctrl+0      change_font_size all 0

# ─── Opacity ───
map ctrl+shift+9 set_background_opacity -0.05
map ctrl+shift+8 set_background_opacity +0.05
map ctrl+shift+0 set_background_opacity 1.0

# ─── Miscellaneous ───
map f5 load_config_file
map f11 toggle_fullscreen
map kitty_mod+f11 toggle_maximized
map kitty_mod+u kitten unicode_input
map kitty_mod+e open_url_with_hints
map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>shift+f kitten hints --type path
map kitty_mod+p>l kitten hints --type line --program -
map kitty_mod+p>w kitten hints --type word --program -
map kitty_mod+p>h kitten hints --type hash --program -
map kitty_mod+p>n kitten hints --type linenum

# ─── Search ───
map kitty_mod+/ launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac

# ═══════════════════════════════════════════════════════════════════
# ADVANCED
# ═══════════════════════════════════════════════════════════════════
update_check_interval 24
startup_session none
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size 512
file_transfer_confirmation_bypass
allow_hyperlinks yes
shell_integration enabled
term xterm-kitty

# Linux specific
linux_display_server auto
wayland_titlebar_color background

# ═══════════════════════════════════════════════════════════════════
# LAYOUT
# ═══════════════════════════════════════════════════════════════════
enabled_layouts splits,stack,tall,grid

# ═══════════════════════════════════════════════════════════════════
# OS SPECIFIC
# ═══════════════════════════════════════════════════════════════════
# Linux
wayland_enable_ime yes
linux_bell_theme __custom

# ═══════════════════════════════════════════════════════════════════
# STARTUP NOTIFICATION
# ═══════════════════════════════════════════════════════════════════
notify_on_cmd_finish unfocused 10.0 command notify-send "kitty" "Command finished"
