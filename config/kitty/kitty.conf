#############################################
# RED HOOD CYBERPUNK – BATCOMPUTER PROFILE  #
# Kitty terminal (local cockpit)            #
#############################################

##########
# FONTS  #
##########
font_family      DankMono Nerd Font
bold_font        DankMono Nerd Font Bold
italic_font      DankMono Nerd Font Italic
bold_italic_font DankMono Nerd Font Bold Italic
font_size 11.5
disable_ligatures never

#####################
# CORES / APARÊNCIA #
#####################
foreground #e6edf3
background #0a0b0d
background_opacity 0.92

selection_foreground #0a0b0d
selection_background #dc143c

cursor #ff073a
cursor_text_color #0a0b0d

color0  #0a0b0d
color1  #dc143c
color2  #22e3b3
color3  #facc15
color4  #22d3ee
color5  #7c3aed
color6  #ee79d1
color7  #e6edf3
color8  #1f232a
color9  #ff073a
color10 #44f7c5
color11 #ffd95a
color12 #44e6ff
color13 #a98bff
color14 #ff9eeb
color15 #ffffff

##############
# JANELAS    #
##############
remember_window_size yes
initial_window_width  1600
initial_window_height 900
window_padding_width 14
window_border_width 1.0
draw_minimal_borders yes
hide_window_decorations yes
enabled_layouts tall,fat,grid,stack

############
# ABAS     #
############
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
active_tab_foreground   #000000
active_tab_background   #dc143c
inactive_tab_foreground #666666
inactive_tab_background #1f232a

##############
# TERMINAL   #
##############
shell zsh
term xterm-256color
scrollback_lines 10000
mouse_hide_wait 0.5
detect_urls yes
open_url_with default
enable_audio_bell no
visual_bell_duration 0
shell_integration enabled
allow_remote_control yes
confirm_os_window_close 1
confirm_exit 0

###########################
# MOUSE / SELEÇÃO / COPY  #
###########################
copy_on_select no
strip_trailing_spaces smart
mouse_map left press ungrabbed mouse_selection normal
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line
clipboard_control write-clipboard write-primary

#########################
# MOD KEY & CONVENÇÕES  #
#########################
kitty_mod ctrl+shift

#########################
# ATALHOS DE JANELAS    #
#########################
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+q     close_tab
map kitty_mod+]     next_tab
map kitty_mod+[     previous_tab
map kitty_mod+1     goto_tab 1
map kitty_mod+2     goto_tab 2
map kitty_mod+3     goto_tab 3
map kitty_mod+4     goto_tab 4
map kitty_mod+5     goto_tab 5

map kitty_mod+enter new_window_with_cwd
map kitty_mod+n     new_os_window_with_cwd
map kitty_mod+w     close_window

# Splits
map kitty_mod+v launch --location=hsplit --cwd=current
map kitty_mod+h launch --location=vsplit --cwd=current

#########################
# LAYOUTS / NAVEGAÇÃO   #
#########################
map kitty_mod+l next_layout
map kitty_mod+k previous_layout

map kitty_mod+left  focus_window left
map kitty_mod+right focus_window right
map kitty_mod+up    focus_window up
map kitty_mod+down  focus_window down

map kitty_mod+shift+left  resize_window narrower
map kitty_mod+shift+right resize_window wider
map kitty_mod+shift+up    resize_window taller
map kitty_mod+shift+down  resize_window shorter

#########################
# FONTE / ZOOM / OPAC.  #
#########################
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0     change_font_size all 0

map kitty_mod+o          change_background_opacity +0.05
map kitty_mod+shift+o    change_background_opacity -0.05

#########################
# BUSCA / FZF OVERLAY   #
#########################
map kitty_mod+/ launch --type=overlay --stdin-source=@screen_scrollback \
  fzf --no-sort --no-mouse --exact -i --tac
map kitty_mod+f show_scrollback_search

##################################
# INTEGRAÇÃO BAT-HUD / WORKSTATION
##################################
# HUD overlay (espera ENTER para fechar)
map kitty_mod+g launch --type=overlay --cwd=current zsh -lc ' ~/workstation/bin/bat_hud.sh; echo; read -n1 -rp "ENTER para fechar..." '

# Project picker (zoxide + fzf -> nova tab)
map kitty_mod+p launch --type=overlay zsh -lc 'if command -v zoxide >/dev/null 2>&1 && command -v fzf >/dev/null 2>&1; then dest=$(zoxide query -l | fzf --height 100% --reverse --prompt="BAT-PROJ> "); if [ -n "$dest" ]; then kitty @ launch --type=tab --cwd "$dest"; fi; else echo "Instale zoxide + fzf para usar o project picker."; read -n1 -rp "ENTER para fechar..."; fi'

# Stack/layout popup (reaproveita seu script tmux stack se quiser testar)
map kitty_mod+s launch --type=overlay --cwd=current zsh -lc ' $HOME/workstation/bin/bat_tmux_stack.sh; echo; read -n1 -rp "ENTER..." '

######################
# PERF / QUALIDADE   #
######################
wheel_scroll_multiplier 1.0
sync_to_monitor yes

########################
# COPY / PASTE CLÁSSICO
########################
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

###############
# RELOAD CONF #
###############
map f5 load_config_file
