# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = DOTFILES_DIR,$HOME/dotfiles

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla (Firefox Wayland)
env = MOZ_ENABLE_WAYLAND,1

# --- AMD Specific Environment Variables ---
# Estas são variáveis comuns que podem otimizar o desempenho em GPUs AMD.
# Descomente se encontrar problemas ou quiser experimentar.
# env = AMD_VULKAN_ICD,RADV
# env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
# env = WLR_RENDERER_ALLOW_SOFTWARE,1 # Para GPUs mais antigas ou problemas de renderização
# env = LIBVA_DRIVER_NAME,radeonsi # Para aceleração de vídeo em alguns aplicativos

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# XWayland
xwayland {
  force_zero_scaling = true
}

# Polkit and authentication
env = POLKIT_AUTH_AGENT,hyprpolkitagent
env = SSH_ASKPASS_REQUIRE,never
