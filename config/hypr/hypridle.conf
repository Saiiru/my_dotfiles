$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 3 minutes – start screensaver
listener {
    timeout = 180
    on-timeout = ~/.config/hypr/scripts/screensaver-cyberpunk.sh
    on-resume = pkill -f "kitty --class Screensaver"
}

# 4 minutes – dim displays
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 25% && ~/.config/hypr/scripts/red-hood-notify.sh system "Display dimmed"
    on-resume = brightnessctl -r
}

# 5 minutes – lock screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    on-resume = ~/.config/hypr/scripts/red-hood-notify.sh system "Session unlocked"
}

# 6 minutes – power down displays
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 minutes – suspend system
listener {
    timeout = 600
    on-timeout = $suspend_cmd
}
