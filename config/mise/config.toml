[settings]
experimental = true
legacy_version_file = true
always_keep_download = false
always_keep_install = false
plugin_autoupdate_last_check_duration = "7d"
verbose = false
asdf_compat = false
jobs = 4
raw = false
yes = false

[env]
_.path = [
    "{{ config_root }}/bin",
    "$HOME/.local/bin",
    "$HOME/gotham/bin/system",
    "$HOME/gotham/bin/battery",
    "$HOME/gotham/bin/theme",
    "$HOME/gotham/bin/notifications"
]

#───────────────────────────────────────────────────────────────────────
# CORE PROGRAMMING LANGUAGES
#───────────────────────────────────────────────────────────────────────
[tools]
# Python - Use core:python backend
"core:python" = "3.12"
"core:python@3.11" = "3.11"

# Node.js - Web development, tooling
"core:node" = "20"

# Go - Systems programming, cloud tools
"core:go" = "1.21"

# Rust - Systems programming (use rustup instead for better compatibility)
# "core:rust" = "stable"

# Java - Android development, enterprise
"core:java" = "openjdk-21"

#───────────────────────────────────────────────────────────────────────
# PYTHON TOOLING
#───────────────────────────────────────────────────────────────────────
pipx = "latest"
poetry = "latest"
ruff = "latest"
black = "latest"
mypy = "latest"

#───────────────────────────────────────────────────────────────────────
# NODE.JS TOOLING
#───────────────────────────────────────────────────────────────────────
pnpm = "latest"
yarn = "latest"

#───────────────────────────────────────────────────────────────────────
# RUST TOOLING
#───────────────────────────────────────────────────────────────────────
# Note: Prefer rustup for Rust toolchain management
# These are Rust-written tools, not Rust versions
cargo-binstall = "latest"

#───────────────────────────────────────────────────────────────────────
# GO TOOLING
#───────────────────────────────────────────────────────────────────────
golangci-lint = "latest"
gopls = "latest"
delve = "latest"

#───────────────────────────────────────────────────────────────────────
# DEVOPS & CLOUD
#───────────────────────────────────────────────────────────────────────
kubectl = "latest"
helm = "latest"
terraform = "latest"
docker-compose = "latest"
awscli = "latest"

#───────────────────────────────────────────────────────────────────────
# DATABASE TOOLS
#───────────────────────────────────────────────────────────────────────
postgres = "latest"

#───────────────────────────────────────────────────────────────────────
# UTILITIES
#───────────────────────────────────────────────────────────────────────
jq = "latest"
yq = "latest"
gh = "latest"
"npm:tree-sitter-cli" = "latest"

#───────────────────────────────────────────────────────────────────────
# ANDROID DEVELOPMENT
#───────────────────────────────────────────────────────────────────────
# Note: Android SDK managed separately via android-tools package
# gradle = "latest"  # Uncomment if needed

#───────────────────────────────────────────────────────────────────────
# EMBEDDED DEVELOPMENT (Arduino/ESP32)
#───────────────────────────────────────────────────────────────────────
# Note: Arduino tooling managed via:
# - arduino-cli (pacman package)
# - platformio (pacman package)
# Python tools for embedded:
# - esptool installed via pipx
# - platformio-core via Python above

