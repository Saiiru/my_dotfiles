# WORKSTATION OPS — Mise Runtime Manager Configuration
# Professional multi-language development environment
# Author: Sairu
# Last Updated: 2024-11-13
#═══════════════════════════════════════════════════════════════════════

[settings]
experimental = true
legacy_version_file = true
always_keep_download = false
always_keep_install = false
plugin_autoupdate_last_check_duration = "7d"
verbose = false
asdf_compat = false
jobs = 4
raw = false
yes = false

[env]
_.path = [
    "$HOME/.local/bin",
    "$HOME/workstation/scripts"
]

#───────────────────────────────────────────────────────────────────────
# CORE PROGRAMMING LANGUAGES
#───────────────────────────────────────────────────────────────────────
[tools]
# Python - Multiple versions
python = "3.12"

# Node.js - Web development, tooling
node = "20"

# Go - Systems programming, cloud tools
go = "1.21"

# Java - Android development, enterprise
java = "openjdk-21"

# .NET ecosystem (fsautocomplete, etc.)
dotnet = "latest"

# Lua (Neovim) runtime
lua = "5.4"

# Ruby (rails tooling + gems managed via tasks)
ruby = "3.3"

# Modern JS runtimes
bun = "latest"
deno = "latest"

#───────────────────────────────────────────────────────────────────────
# PYTHON TOOLING (via pipx)
#───────────────────────────────────────────────────────────────────────
poetry = "latest"
ruff = "latest"
black = "latest"

#───────────────────────────────────────────────────────────────────────
# NODE.JS TOOLING (via npm)
#───────────────────────────────────────────────────────────────────────
pnpm = "latest"
yarn = "latest"

#───────────────────────────────────────────────────────────────────────
# RUST TOOLING
#───────────────────────────────────────────────────────────────────────
# Note: Use rustup for Rust toolchain management (better LSP support)

#───────────────────────────────────────────────────────────────────────
# GO TOOLING
#───────────────────────────────────────────────────────────────────────
# Note: Install via 'go install' separately if needed

#───────────────────────────────────────────────────────────────────────
# DEVOPS & CLOUD
#───────────────────────────────────────────────────────────────────────
kubectl = "latest"
helm = "latest"
terraform = "latest"

#───────────────────────────────────────────────────────────────────────
# UTILITIES
#───────────────────────────────────────────────────────────────────────
jq = "latest"
yq = "latest"
gh = "latest"

#───────────────────────────────────────────────────────────────────────
# ANDROID DEVELOPMENT
#───────────────────────────────────────────────────────────────────────
# Note: Android SDK managed separately via android-tools package
# gradle = "latest"  # Uncomment if needed

#───────────────────────────────────────────────────────────────────────
# EMBEDDED DEVELOPMENT (Arduino/ESP32)
#───────────────────────────────────────────────────────────────────────
# Note: Arduino tooling managed via:
# - arduino-cli (pacman package)
# - platformio (pacman package)
# Python tools for embedded:
# - esptool installed via pipx
# - platformio-core via Python above
