#═══════════════════════════════════════════════════════════════════════
# GOTHAM SYSTEM — Mise Configuration
# Multi-language development environment
#═══════════════════════════════════════════════════════════════════════

[settings]
experimental = true
legacy_version_file = true
always_keep_download = false
always_keep_install = false
plugin_autoupdate_last_check_duration = "7d"
verbose = false
asdf_compat = false
jobs = 4
raw = false
yes = false

[env]
_.path = [
    "{{ config_root }}/bin",
    "$HOME/.local/bin"
]

#───────────────────────────────────────────────────────────────────────
# PYTHON
#───────────────────────────────────────────────────────────────────────
[tools]
python = "3.12"
"python:latest" = "latest"
"python:3.11" = "3.11"

# Python tools
pipx = "latest"
poetry = "latest"
ruff = "latest"
black = "latest"
mypy = "latest"

#───────────────────────────────────────────────────────────────────────
# NODE.JS
#───────────────────────────────────────────────────────────────────────
node = "20"
"node:lts" = "lts"
"node:latest" = "latest"

# Node tools
pnpm = "latest"
yarn = "latest"

#───────────────────────────────────────────────────────────────────────
# GO
#───────────────────────────────────────────────────────────────────────
go = "1.21"
"go:latest" = "latest"

# Go tools
golangci-lint = "latest"
gopls = "latest"
delve = "latest"

#───────────────────────────────────────────────────────────────────────
# RUST
#───────────────────────────────────────────────────────────────────────
rust = "stable"
"rust:nightly" = "nightly"

#───────────────────────────────────────────────────────────────────────
# JAVA / JVM
#───────────────────────────────────────────────────────────────────────
java = "openjdk-21"
"java:17" = "openjdk-17"
"java:11" = "openjdk-11"

maven = "latest"
gradle = "latest"

#───────────────────────────────────────────────────────────────────────
# DATABASE TOOLS
#───────────────────────────────────────────────────────────────────────
postgres = "latest"

#───────────────────────────────────────────────────────────────────────
# DEVOPS / CLOUD
#───────────────────────────────────────────────────────────────────────
kubectl = "latest"
helm = "latest"
terraform = "latest"
docker-compose = "latest"
awscli = "latest"

#───────────────────────────────────────────────────────────────────────
# UTILITIES
#───────────────────────────────────────────────────────────────────────
jq = "latest"
yq = "latest"
github-cli = "latest"

# Editor tools
[tools]
"npm:tree-sitter-cli" = "latest"
