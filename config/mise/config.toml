#═══════════════════════════════════════════════════════════════════════
# GOTHAM SYSTEM — Mise Configuration
# Multi-language development environment
#═══════════════════════════════════════════════════════════════════════

[settings]
experimental = true
legacy_version_file = true
always_keep_download = false
always_keep_install = false
plugin_autoupdate_last_check_duration = "7d"
verbose = false
asdf_compat = false
jobs = 4
raw = false
yes = false

[env]
_.path = [
    "{{ config_root }}/bin",
    "$HOME/.local/bin"
]

#───────────────────────────────────────────────────────────────────────
# PROGRAMMING LANGUAGES
#───────────────────────────────────────────────────────────────────────
[tools]
# Python
"python:3.12" = "3.12"
"python:3.11" = "3.11"

# Node.js
"node:20" = "20"
"node:lts" = "lts"

# Go
"go:1.21" = "1.21"

# Rust
"rust:stable" = "stable"

# Java
"java:openjdk-21" = "openjdk-21"
"java:17" = "openjdk-17"

#───────────────────────────────────────────────────────────────────────
# DEVELOPMENT TOOLS
#───────────────────────────────────────────────────────────────────────
# Node tools
pnpm = "latest"
yarn = "latest"

# DevOps
kubectl = "latest"
helm = "latest"
terraform = "latest"

# Utilities
jq = "latest"
yq = "latest"

# Tree-sitter CLI for nvim
"npm:tree-sitter-cli" = "latest"
