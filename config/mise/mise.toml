# BATMAN CORE STACK – global dev tools

[env]
EDITOR = "nvim"
VISUAL = "nvim"

# Locale previsível pro tooling
LANG   = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"

# Qualidade de vida Python
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PYTHONWARNINGS                = "ignore"

# Git: diffs mais bonitos (se delta instalado)
GIT_PAGER = "delta"

#──────────────────────────────── TOOLS GLOBAIS ────────────────────────────────
[tools]
# Node / JS / TS
node    = "lts"
pnpm    = "latest"
yarn    = "latest"

# Python
python  = "3.12"

# Go
go      = "1.22"

# Java & Build
java    = "21"
maven   = "latest"
gradle  = "latest"

# Rust
rust    = "stable"

# Utilidades gerais (dependem de plugins do mise)
# eza     = "latest"
# bat     = "latest"
# ripgrep = "latest"
# fd      = "latest"

#──────────────────────────────── TASKS GLOBAIS ────────────────────────────────
[tasks.bootstrap]
description = "Instala/atualiza toda a toolchain BATMAN (global)"
run = """
mise install
"""

[tasks.update-tools]
description = "Atualiza linguagens/ferramentas para versões mais novas compatíveis"
run = """
mise upgrade
"""

[tasks.dev-shell]
description = "Abre sessão tmux 'dev' com Zsh + mise ativados"
run = """
tmux new -A -s dev 'zsh'
"""

[tasks.qa-check]
description = "Checks básicos de QA no repo atual"
run = """
echo "[QA] Git status:"
git status -sb || true

echo
echo "[QA] Docker:"
docker info >/dev/null 2>&1 && echo "Docker OK" || echo "Docker não disponível"

echo
echo "[QA] Pre-commit:"
if command -v pre-commit >/dev/null 2>&1; then
  pre-commit run --all-files || true
else
  echo "pre-commit não instalado (opcional)"
fi
"""

[tasks.java-env]
description = "Mostra informações do ambiente Java/JVM"
run = """
echo "JAVA:"
java -version || true
echo
echo "MAVEN:"
mvn -version || true
echo
echo "GRADLE:"
gradle -version || true
"""

[tasks.node-env]
description = "Mostra informações do ambiente Node/JS"
run = """
node -v || true
npm -v || true
pnpm -v || true
yarn -v || true
"""

[tasks.go-env]
description = "Mostra informações do ambiente Go"
run = """
go version || true
go env GOPATH GOMODCACHE || true
"""

[tasks.python-env]
description = "Mostra informações do ambiente Python"
run = """
python --version || true
pip --version || true
"""

[tasks.rust-env]
description = "Mostra informações do ambiente Rust"
run = """
rustc --version || true
cargo --version || true
"""

# ───────────────────────────── HUD / TMUX / STARTERS ──────────────────────────

[tasks.hud]
description = "🦇 Abrir BAT-HUD (stack-aware) no diretório atual"
run = "bat-hud"

[tasks.new-project]
description = "🆕 Criar projeto a partir dos starters (java|python|go)"
run = "bat-new-project"

[tasks.tmux-stack]
description = "📐 Abrir sessão tmux com layout dev/test/logs (stack-aware)"
run = "bat-tmux-layout"
