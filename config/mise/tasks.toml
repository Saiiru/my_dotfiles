[tasks.ruby-tools]
description = "Install/update Ruby tooling (rubocop, ruby-lsp)"
run = [
  "gem install --no-document rubocop ruby-lsp"
]

[tasks.fsautocomplete]
description = "Install/update fsautocomplete via dotnet tools"
run = [
  "dotnet tool update --global fsautocomplete || dotnet tool install --global fsautocomplete"
]

[tasks.bootstrap]
description = "Install all auxiliary tooling (Ruby gems, fsautocomplete)"
depends = ["ruby-tools", "fsautocomplete"]
